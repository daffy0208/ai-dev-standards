name: Branch Cleanup Reminder

# This workflow creates an issue reminder to review and clean up merged branches
# Run this weekly to maintain repository hygiene

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Fetch all branches
        run: git fetch --all

      - name: Check for merged branches
        id: check
        run: |
          # Get list of merged branches (excluding main and current branch)
          MERGED_BRANCHES=$(git branch -r --merged origin/main | \
            grep -v 'HEAD\|main' | \
            sed 's/origin\///' | \
            grep -v '^$' || echo "")
          
          # Count merged branches
          BRANCH_COUNT=$(echo "$MERGED_BRANCHES" | grep -c . || echo "0")
          
          echo "branch_count=$BRANCH_COUNT" >> $GITHUB_OUTPUT
          
          # Create branch list for issue
          if [ $BRANCH_COUNT -gt 0 ]; then
            echo "BRANCHES<<EOF" >> $GITHUB_ENV
            echo "$MERGED_BRANCHES" | while read branch; do
              echo "- \`$branch\`"
            done
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Create or update issue
        if: steps.check.outputs.branch_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const branchCount = '${{ steps.check.outputs.branch_count }}';
            const branches = process.env.BRANCHES;
            
            const issueTitle = `🧹 Branch Cleanup: ${branchCount} merged branches to delete`;
            const issueBody = `## Branch Cleanup Reminder
            
            This repository has **${branchCount} merged branches** that can be safely deleted.
            
            ### Merged Branches
            
            ${branches}
            
            ### How to Clean Up
            
            **Option 1: Use the cleanup script (Recommended)**
            \`\`\`bash
            bash scripts/cleanup-merged-branches.sh
            \`\`\`
            
            **Option 2: Enable automatic deletion**
            - Go to [Repository Settings → Pull Requests](https://github.com/${{ github.repository }}/settings)
            - Check ☑️ "Automatically delete head branches"
            - See [REPO-CLEANUP-GUIDE.md](./REPO-CLEANUP-GUIDE.md) for details
            
            **Option 3: Manual cleanup**
            \`\`\`bash
            git branch -r --merged origin/main | \\
              grep -v 'HEAD\\|main' | \\
              sed 's/origin\\///' | \\
              xargs -I {} git push origin --delete {}
            \`\`\`
            
            ### Why Clean Up?
            
            ✅ Keeps repository organized
            ✅ Reduces clutter in branch list
            ✅ Follows Git best practices
            ✅ Improves repository navigation
            
            ---
            
            *This issue was automatically generated by the Branch Cleanup workflow.*
            *After cleaning up, close this issue.*`;
            
            // Check if there's an existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance,automated'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Branch Cleanup')
            );
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['maintenance', 'automated', 'good first issue']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }

      - name: No cleanup needed
        if: steps.check.outputs.branch_count == 0
        run: |
          echo "✅ No merged branches found. Repository is clean!"
